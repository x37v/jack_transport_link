name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # The tag is v<version>[-<prerelease>], like v0.0.14 or v0.0.14-beta.1, and <version> has to be the
  # PROJECT_VERSION in CMakeLists.txt. A prerelease builds the debian version 0.0.14~beta.1-1.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.]+))?$ ]]; then
            echo "::error::tag '$TAG' is not of the form v<version>[-<prerelease>]"
            exit 1
          fi
          BASE="${BASH_REMATCH[1]}"
          PRERELEASE="${BASH_REMATCH[3]}"
          PROJECT_VERSION=$(sed -nE 's/^set\(PROJECT_VERSION "([^"]+)"\).*/\1/p' CMakeLists.txt)
          if [[ "$BASE" != "$PROJECT_VERSION" ]]; then
            echo "::error::tag '$TAG' says version $BASE but CMakeLists.txt has PROJECT_VERSION $PROJECT_VERSION"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  source-bundle:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Create source archive
        run: |
          tar \
            --exclude-vcs \
            --exclude='.github' \
            --transform 's|^\.|jack_transport_link-${{ github.ref_name }}|' \
            -czf ../jack_transport_link-${{ github.ref_name }}-src.tar.gz .
      - name: Upload source archive
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.check.outputs.prerelease != '' }}
          files: ../jack_transport_link-${{ github.ref_name }}-src.tar.gz

  build-rpi64:
    runs-on: ubuntu-latest
    needs: check
    container:
      image: xnor/rnbo-runner-xpile:0.1
      options: --user root
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build rpi64
        env:
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          mkdir -p build-rpi64
          cd build-rpi64
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=/home/build/cmake/toolchains/aarch64-unknown-linux-gcc11_4.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64 \
            -DJTL_PRERELEASE="$PRERELEASE" \
            .. && make -j$(nproc) && cpack
      - name: Upload deb
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.check.outputs.prerelease != '' }}
          files: build-rpi64/*.deb

  build-rpi32:
    runs-on: ubuntu-latest
    needs: check
    container:
      image: xnor/rnbo-runner-xpile:0.1
      options: --user root
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build rpi32
        env:
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          mkdir -p build-rpi32
          cd build-rpi32
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=/home/build/cmake/toolchains/armv7-unknown-linux-gnueabihf-gcc11_4.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=armhf \
            -DJTL_PRERELEASE="$PRERELEASE" \
            .. && make -j$(nproc) && cpack
      - name: Upload deb
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.check.outputs.prerelease != '' }}
          files: build-rpi32/*.deb

  build-move:
    runs-on: ubuntu-latest
    needs: check
    container:
      image: xnor/rnbo-runner-xpile:0.1
      options: --user root
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build move
        run: |
          mkdir -p build-move
          cd build-move
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=/home/build/cmake/toolchains/aarch64-unknown-linux-gcc11_4.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_RPATH=/data/UserData/rnbo/lib/ \
            .. && make -j$(nproc)
      # bin/jack_transport_link, the layout the RNBO Move takeover package installs under /data/UserData/rnbo/
      - name: Package executable
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p build-move/pkg/bin
          cp build-move/jack_transport_link build-move/pkg/bin/
          tar --owner=0 --group=0 -czf "build-move/jack_transport_link_${VERSION}_move.tar.gz" -C build-move/pkg bin
      - name: Upload package
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.check.outputs.prerelease != '' }}
          files: build-move/jack_transport_link_*_move.tar.gz
